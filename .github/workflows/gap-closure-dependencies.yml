name: Gap closure dependency workspace

# Temporary, credential-free dependency bootstrap. Remove from the final diff.
on:
  pull_request:
    paths:
      - .github/workflows/gap-closure-dependencies.yml

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Download pinned public integration sources
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/gapdeps"
          mkdir -p "$bundle/versions" "$bundle/modcache" "$bundle/tools" "$bundle/uvcache"
          index=0
          for spec in \
            github.com/anthropics/anthropic-sdk-go@v1.73.0 \
            github.com/cloudwego/eino-ext/components/model/openai@55c57a980974ae1fc28fd32a5763ce01a62d832d \
            github.com/git-hulk/langfuse-go@v1.0.1 \
            github.com/oiime/langfuse-go@e0b018ad0878196a9711d89daa5d66e8e8dc39f5 \
            golang.org/x/vuln/cmd/govulncheck@v1.7.0; do
            index=$((index + 1))
            workspace="$RUNNER_TEMP/dependency-$index"
            mkdir -p "$workspace"
            (
              cd "$workspace"
              GOWORK=off go mod init example.com/credential-free-dependency-check
              GOWORK=off go get "$spec"
              GOWORK=off go mod download all
              cp go.mod go.sum "$bundle/versions/" 2>/dev/null || true
              GOWORK=off go list -m -json all > "$bundle/versions/modules-$index.json"
            )
          done
          go mod download -json golang.org/toolchain@v0.0.1-go1.25.0.linux-amd64 > "$bundle/versions/minimum-toolchain.json"
      - name: Prepare locked Python interoperability oracle
        run: |
          set -euo pipefail
          cd validation/parity
          uv sync --locked
      - name: Package only public caches and tools
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/gapdeps"
          tar -C "$(go env GOMODCACHE)" --exclude=cache/vcs -cf - . | tar -x -C "$bundle/modcache"
          cp "$(command -v uv)" "$bundle/tools/"
          tar -C "$(uv cache dir)" -cf - . | tar -x -C "$bundle/uvcache"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/gapdeps.tar.gz" gapdeps
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gap-closure-public-dependencies
          path: ${{ runner.temp }}/gapdeps.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

name: SDK gap closure source recovery

# Temporary recovery aid; removed after local validation is restored.
on:
  pull_request:
    paths:
      - .github/workflows/gap-closure-development.yml

permissions:
  contents: read

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == 'fgn/go-langfuse' && github.event.pull_request.head.ref == 'feat/sdk-gap-closure-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          set -euo pipefail
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr40-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/pr40-source-revision.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr40-source-recovery
          path: |
            ${{ runner.temp }}/pr40-source.tar.gz
            ${{ runner.temp }}/pr40-source-revision.txt
          retention-days: 1
          if-no-files-found: error

name: SDK gap closure development checks

# Temporary remote editing aid after the local workspace stopped responding.
# Restricted to this exact same-repository draft branch. Remove before completion.
on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: gap-closure-development
  cancel-in-progress: false

jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == 'fgn/go-langfuse' && github.event.pull_request.head.ref == 'feat/sdk-gap-closure-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: true
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Format candidate and regenerate the pinned contract index
        run: |
          set -euo pipefail
          python3 scripts/index-api-contract.py
          task format
          for module in contrib/openai contrib/googlegenai contrib/anthropic contrib/integrationtest; do
            if test -f "$module/go.mod"; then
              (cd "$module" && ../../bin/golangci-lint fmt && GOWORK=off go mod tidy)
            fi
          done
      - name: Save only formatting and contract-index changes to the draft branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = feat/sdk-gap-closure-2026-09-17
          git add -u
          git add -- api/testdata/contract-index.json
          for module in contrib/openai contrib/googlegenai contrib/anthropic contrib/integrationtest; do
            if test -f "$module/go.sum"; then git add -- "$module/go.sum"; fi
          done
          if ! git diff --cached --quiet; then
            test "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format and index the SDK gap-closure candidate'
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
          printf 'Validated source commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate candidate
        run: |
          set -euo pipefail
          python3 scripts/index-api-contract.py --check
          task ci
          if test -f contrib/anthropic/go.mod; then
            (cd contrib/anthropic && ../../bin/golangci-lint run --timeout 2m && go vet ./... && go test -race -count=1 -timeout=120s ./...)
          fi

name: Recover pinned SDK contract

# Temporary recovery step for the unavailable local editing workspace.
# This workflow only writes the exact hash-pinned public schema to this PR branch.
on:
  pull_request:
    paths:
      - .github/workflows/gap-closure-schema.yml

permissions:
  contents: write

jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == 'fgn/go-langfuse' && github.event.pull_request.head.ref == 'feat/sdk-gap-closure-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Recover the exact selected schema
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$HEAD_BRANCH" = feat/sdk-gap-closure-2026-09-17
          target=api/testdata/langfuse-openapi-2026-09-17.yaml
          expected=b235737d48b117621f9d607b2beb48b135851fac7bff2aa72b50c6cc8796e9df
          if test -f "$target"; then
            printf '%s  %s\n' "$expected" "$target" | sha256sum --check
            exit 0
          fi
          curl --fail --silent --show-error --location --max-time 60 \
            https://cloud.langfuse.com/generated/api/openapi.yml \
            --output "$RUNNER_TEMP/openapi.yml"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/openapi.yml" | sha256sum --check
          mkdir -p api/testdata
          cp "$RUNNER_TEMP/openapi.yml" "$target"
          test "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'chore(api): pin the verified Langfuse OpenAPI contract'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"

name: Gap closure validation workspace

# Temporary bootstrap for the gap-closure PR's offline validation environment.
# Remove this workflow after the workspace artifact has been consumed.
on:
  pull_request:
    paths:
      - .github/workflows/gap-closure-validation.yml

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      - name: Prepare public dependencies and formatter
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go mod download
          for module in contrib/openai contrib/googlegenai contrib/integrationtest validation; do
            (cd "$module" && GOWORK=off go mod download)
          done
          task format:check
      - name: Package credential-free offline workspace
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/langfuse-offline"
          mkdir -p "$bundle/source" "$bundle/go" "$bundle/modcache" "$bundle/tools"
          # Only committed public source; never copy .git, runner state or environment.
          git archive HEAD | tar -x -C "$bundle/source"
          cp -a "$(go env GOROOT)/." "$bundle/go/"
          # The module cache contains public dependencies. Exclude VCS checkout
          # metadata rather than copying possible authenticated remote URLs.
          tar -C "$(go env GOMODCACHE)" --exclude=cache/vcs -cf - . | tar -x -C "$bundle/modcache"
          cp bin/golangci-lint "$bundle/tools/"
          cp "$(command -v task)" "$bundle/tools/"
          go version > "$bundle/toolchain-version.txt"
          git rev-parse HEAD > "$bundle/source-revision.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/langfuse-offline.tar.gz" langfuse-offline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langfuse-offline-workspace
          path: ${{ runner.temp }}/langfuse-offline.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

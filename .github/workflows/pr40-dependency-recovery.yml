name: PR40 dependency recovery

# Temporary read-only dependency transfer for the offline editing environment.
on:
  pull_request:
    paths:
      - .github/workflows/pr40-dependency-recovery.yml
permissions:
  contents: read
jobs:
  recover:
    if: github.event.pull_request.head.repo.full_name == 'fgn/go-langfuse' && github.event.pull_request.head.ref == 'feat/sdk-gap-closure-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: false
      - name: Retrieve the public patch with the Go checksum database enabled
        env:
          GOWORK: "off"
          GOTOOLCHAIN: local
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/grpc-patch"
          cd "$RUNNER_TEMP"
          go mod download -json google.golang.org/grpc@v1.83.1 > grpc-patch/metadata.json
          for extension in zip ziphash mod info; do
            cp "$(go env GOMODCACHE)/cache/download/google.golang.org/grpc/@v/v1.83.1.$extension" grpc-patch/
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr40-grpc-security-patch
          path: ${{ runner.temp }}/grpc-patch
          retention-days: 1
          if-no-files-found: error
